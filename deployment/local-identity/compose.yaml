# Local integration only. All published ports bind to loopback.
# Auth/PostgREST/Postgres pins match the official Supabase compose on 2026-10-19.
name: tover-identity
services:
  db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./identity.sh init}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TO_DEV_APP_PASSWORD: ${TO_DEV_APP_PASSWORD:?Run ./identity.sh init}
      JWT_EXP: 3600
    ports:
      - 127.0.0.1:${IDENTITY_DB_PORT:-55432}:5432
    volumes:
      - identity-data:/var/lib/postgresql/data
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=warning]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -h localhost']
      interval: 2s
      timeout: 2s
      retries: 60
  mail:
    image: axllent/mailpit:v1.27.8
    ports:
      - 127.0.0.1:${IDENTITY_MAIL_PORT:-58025}:8025
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${IDENTITY_API_PORT:-58000}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${TO_DEV_SITE_URL:-http://localhost:3030}
      GOTRUE_URI_ALLOW_LIST: ${TO_DEV_SITE_URL:-http://localhost:3030}/auth/confirm
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Run ./identity.sh init}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ISSUER: http://127.0.0.1:${IDENTITY_API_PORT:-58000}/auth/v1
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_ADMIN_EMAIL: auth@tover.test
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: Tover local identity
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway/templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://gateway/templates/invite.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway/templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway/templates/magic-link.html
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 2s
      timeout: 2s
      retries: 60
  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 2s
      timeout: 2s
      retries: 60
  gateway:
    image: nginx:1.29.3-alpine
    ports:
      - 127.0.0.1:${IDENTITY_API_PORT:-58000}:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./templates:/usr/share/nginx/html/templates:ro
    depends_on:
      - auth
      - rest
volumes:
  identity-data:
