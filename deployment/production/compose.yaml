name: ${TOVER_DEPLOYMENT_NAME:-tover-production}
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  db:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure private .env}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TOVER_DB_PASSWORD: ${TOVER_DB_PASSWORD:?Configure private .env}
      JWT_EXP: 3600
    volumes:
      - identity-data:/var/lib/postgresql/data
    networks: [identity]
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=warning]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -h localhost']
      interval: 5s
      timeout: 3s
      retries: 36
  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      db: {condition: service_healthy}
    networks: [identity, outbound]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${TOVER_ORIGIN:?Configure HTTPS origin}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: '8'
      GOTRUE_DB_MAX_IDLE_POOL_SIZE: '4'
      GOTRUE_DB_CONN_PERCENTAGE: '0'
      GOTRUE_SITE_URL: ${TOVER_ORIGIN}
      GOTRUE_URI_ALLOW_LIST: ${TOVER_ORIGIN}/auth/confirm
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Configure private .env}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ISSUER: ${TOVER_ORIGIN}/auth/v1
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: 'Tover: confirm email / подтвердите почту'
      GOTRUE_MAILER_SUBJECTS_INVITE: 'Tover: invitation / приглашение'
      GOTRUE_MAILER_SUBJECTS_RECOVERY: 'Tover: recover access / восстановление доступа'
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: 'Tover: sign in / вход'
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:?Configure verified sender}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:?Configure real SMTP}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:?Configure real SMTP}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:?Configure real SMTP}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Tover}
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://proxy:8080/confirmation.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://proxy:8080/invite.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://proxy:8080/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://proxy:8080/magic-link.html
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 5s
      timeout: 3s
      retries: 36
  rest:
    image: postgrest/postgrest:v14.18@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      db: {condition: service_healthy}
    networks: [identity]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 3s
      retries: 36
  app:
    image: ${TOVER_APP_IMAGE:?Set a release-specific app image tag}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    # On an 8 GiB host, leave 4 GiB for identity services, filesystem cache and the OS.
    mem_limit: 4g
    init: true
    stop_grace_period: 30s
    depends_on:
      db: {condition: service_healthy}
      auth: {condition: service_healthy}
      rest: {condition: service_healthy}
    networks: [identity]
    environment:
      TOVER_AUTH_URL: http://auth:9999
      TOVER_REST_URL: http://rest:3000
      TOVER_API_KEY: ${ANON_KEY:?Configure private .env}
      TOVER_AUTH_ADMIN_KEY: ${SERVICE_ROLE_KEY:?Configure private .env}
      TOVER_ORIGIN: ${TOVER_ORIGIN}
      TOVER_JDBC_URL: jdbc:postgresql://db:5432/postgres
      TOVER_DB_USER: tover_app
      TOVER_DB_PASSWORD: ${TOVER_DB_PASSWORD}
      TOVER_SESSION_KEY: ${SESSION_ENCRYPTION_KEY:?Configure private .env}
      TOVER_PORT: 3030
      TOVER_INVENTORY_PATH: /var/lib/tover/inventory
      # Reserve the other 2 GiB in the container for native memory and mapped RDF data.
      JAVA_TOOL_OPTIONS: -Xmx2g -XX:+ExitOnOutOfMemoryError
    volumes:
      - inventory-data:/var/lib/tover
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      app: {condition: service_healthy}
    networks: [identity, outbound]
    environment:
      TOVER_DOMAIN: ${TOVER_DOMAIN:?Configure DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME contact}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./templates:/srv/templates:ro
      - tls-data:/data
      - tls-config:/config
networks:
  identity:
    internal: true
  outbound:
volumes:
  identity-data:
  inventory-data:
  tls-data:
  tls-config:
